name: Daily stock brief

on:
  schedule:
    # Times are UTC. IST = UTC + 5:30. Add, remove or edit lines to change the cadence;
    # GitHub may start a scheduled run up to an hour late when its queues are busy.
    - cron: "15 3 * * 1-5"    # 08:45 IST  pre-open brief (previous close + overnight news)
    - cron: "0 7 * * 1-5"     # 12:30 IST  intraday snapshot (partial candle, volume excluded)
    - cron: "30 10 * * 1-5"   # 16:00 IST  post-close brief (final prices for the day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q anthropic
            python3 analyze.py --ai
          else
            python3 analyze.py
          fi

      - name: Commit and push the brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily stock brief $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
